<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: block; }
      @font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
      :root { --yellow: #f7cf4c; --ink: #0a0a0a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; }
      #stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .video-wrapper { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
      .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }
      .card-host { position: absolute; pointer-events: none; overflow: hidden; }
      .card-host .card { position: relative; width: 100%; height: 100%; }

      /* brand outro treatment: blur + darken the video behind the lockup (matches the clips' ffmpeg gblur sigma 28 / brightness -0.34 / saturation 0.55). See brands/ReactSquad/BRAND.md → Video treatments. */
      .card[data-card-id="outro"] .scrim { position: absolute; inset: 0; backdrop-filter: blur(28px) brightness(0.66) saturate(0.55); -webkit-backdrop-filter: blur(28px) brightness(0.66) saturate(0.55); background: rgba(8,8,8,0.12); }
      .card[data-card-id="outro"] .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
      .card[data-card-id="outro"] .lockup { display: flex; align-items: center; gap: 18px; }
      .card[data-card-id="outro"] .lockup img { height: 64px; width: auto; filter: brightness(0) invert(1); }
      .card[data-card-id="outro"] .wordmark { font-family: "Instrument Sans"; font-weight: 700; font-size: 50px; color: #fff; letter-spacing: -0.5px; }
      .card[data-card-id="outro"] .headline { font-family: "Instrument Sans"; font-weight: 700; font-size: 78px; line-height: 1.05; color: #fff; text-align: center; letter-spacing: -1px; max-width: 1300px; }
      .card[data-card-id="outro"] .cta { display: inline-flex; align-items: center; gap: 16px; margin-top: 6px; padding: 22px 40px; background: var(--yellow); color: var(--ink); border-radius: 16px; font-family: "Instrument Sans"; font-weight: 700; font-size: 38px; letter-spacing: 0.2px; box-shadow: 0 18px 50px rgba(247,207,76,0.28); }
      .card[data-card-id="outro"] .cta .arrow { font-size: 38px; line-height: 1; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="graphic-overlays" data-start="0" data-duration="7.2" data-fps="60" data-width="1920" data-height="1080">
      <div class="video-wrapper" id="video-wrap">
        <video id="bg-video" src="input-video.mp4" muted playsinline data-start="0" data-duration="7.2" data-track-index="1"></video>
      </div>
      <div class="card-host clip" data-card-id="outro" data-start="0" data-duration="7.2" data-track-index="2"
           style="left:0;top:0;width:1920px;height:1080px;visibility:hidden;opacity:0;">
        <div class="card" data-card-id="outro">
          <div class="scrim" id="outro-scrim"></div>
          <div class="wrap">
            <div class="lockup" id="outro-lockup">
              <img src="reactsquad-mark.png" alt="ReactSquad" />
              <div class="wordmark">ReactSquad</div>
            </div>
            <div class="headline" id="outro-headline">Hire senior React<br/>developers — fast.</div>
            <div class="cta" id="outro-cta">
              <span>Visit ReactSquad.io now</span>
              <span class="arrow">→</span>
            </div>
          </div>
        </div>
      </div>
      <script src="vendor/gsap.min.js"></script>
      <script>
        (function () {
          const gsap = window.gsap;
          const tl = gsap.timeline({ paused: true });
          const HOST = '.card-host[data-card-id="outro"]';
          const S = '.card[data-card-id="outro"] ';
          // enter exactly at "thank you for watching" (clip-time 3.0s)
          tl.set(HOST, { visibility: "visible" }, 3.00);
          tl.set(HOST, { opacity: 1 }, 3.00);
          tl.fromTo(S + '#outro-scrim', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.00);
          tl.from(S + '#outro-lockup', { opacity: 0, y: 22, duration: 0.5, ease: "power3.out" }, 3.25);
          tl.from(S + '#outro-headline', { opacity: 0, y: 26, duration: 0.55, ease: "power3.out" }, 3.50);
          tl.fromTo(S + '#outro-cta', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)", transformOrigin: "center" }, 3.85);
          tl.to(S + '#outro-cta .arrow', { x: 10, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 4 }, 4.6);
          window.__timelines = window.__timelines || {};
          window.__timelines["graphic-overlays"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
