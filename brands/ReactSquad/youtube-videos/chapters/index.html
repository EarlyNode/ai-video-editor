<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: block; }
      @font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
      :root { --yellow: #f7cf4c; --ink: #0a0a0a; --glass: rgba(12,12,12,0.90); --line: rgba(255,255,255,0.12); }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; }
      #stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .video-wrapper { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
      .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }
      .card-host { position: absolute; pointer-events: none; overflow: visible; }
      .card-host .card { position: relative; width: 100%; height: 100%; }

      /* TEMPLATE — chapter chip (bottom-left) */
      .card[data-card-id="chapter"] .chip { position: absolute; left: 0; bottom: 0; display: inline-flex; align-items: stretch; height: 96px; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 16px 44px rgba(0,0,0,0.42); will-change: clip-path; }
      .card[data-card-id="chapter"] .num { width: 96px; background: var(--yellow); color: var(--ink); display: flex; align-items: center; justify-content: center; font-family: "Instrument Sans"; font-weight: 700; font-size: 44px; letter-spacing: -1px; }
      .card[data-card-id="chapter"] .body { display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 34px; }
      .card[data-card-id="chapter"] .kick { font-family: "Instrument Sans"; font-weight: 600; font-size: 18px; letter-spacing: 4px; text-transform: uppercase; color: var(--yellow); }
      .card[data-card-id="chapter"] .title { font-family: "Instrument Sans"; font-weight: 700; font-size: 40px; line-height: 1; color: #fff; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="graphic-overlays" data-start="0" data-duration="7" data-fps="60" data-width="1920" data-height="1080">
      <div class="video-wrapper" id="video-wrap">
        <video id="bg-video" src="input-video.mp4" muted playsinline data-start="0" data-duration="7" data-track-index="1"></video>
      </div>
      <div class="card-host clip" data-card-id="chapter" data-start="0" data-duration="7" data-track-index="2"
           style="left:96px;top:884px;width:1300px;height:140px;visibility:hidden;opacity:0;">
        <div class="card" data-card-id="chapter">
          <div class="chip" id="ch-chip">
            <div class="num" id="ch-num">02</div>
            <div class="body">
              <div class="kick" id="ch-kick">Chapter</div>
              <div class="title" id="ch-title">The Review Workflow</div>
            </div>
          </div>
        </div>
      </div>
      <script src="vendor/gsap.min.js"></script>
      <script>
        (function () {
          const gsap = window.gsap;
          const tl = gsap.timeline({ paused: true });
          const HOST = '.card-host[data-card-id="chapter"]';
          const S = '.card[data-card-id="chapter"] ';
          tl.set(HOST, { visibility: "visible" }, 1.50);
          tl.set(HOST, { opacity: 1 }, 1.50);
          tl.fromTo(S + '#ch-chip', { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, 1.50);
          tl.from(S + '#ch-num', { opacity: 0, duration: 0.3 }, 1.70);
          tl.from(S + '#ch-kick', { opacity: 0, y: 8, duration: 0.4, ease: "power2.out" }, 1.80);
          tl.from(S + '#ch-title', { opacity: 0, y: 12, duration: 0.45, ease: "power3.out" }, 1.90);
          // exit
          tl.to(HOST, { opacity: 0, x: -30, duration: 0.45, ease: "power2.in" }, 4.60);
          tl.set(HOST, { visibility: "hidden" }, 5.10);
          window.__timelines = window.__timelines || {};
          window.__timelines["graphic-overlays"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
