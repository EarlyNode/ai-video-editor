<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: block; }
      @font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }

      :root { --yellow: #f7cf4c; --ink: #0a0a0a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; }
      #stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .video-wrapper { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
      .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }
      .card-host { position: absolute; pointer-events: none; overflow: visible; }
      .card-host .card { position: relative; width: 100%; height: 100%; }

      /* flat, wide lower-third anchored near the bottom */
      .card[data-card-id="intro"] .l3 { position: absolute; left: 0; bottom: 0; }

      .card[data-card-id="intro"] .bar {
        display: inline-flex; align-items: center; gap: 26px;
        padding: 20px 44px 20px 30px;
        background: var(--yellow);
        border-radius: 18px;
        box-shadow: 0 16px 44px rgba(0,0,0,0.42);
        will-change: clip-path;
      }
      .card[data-card-id="intro"] .mark { height: 84px; width: auto; display: block; }
      .card[data-card-id="intro"] .divider { width: 3px; height: 78px; background: rgba(10,10,10,0.16); border-radius: 2px; }
      .card[data-card-id="intro"] .text { display: flex; flex-direction: column; gap: 8px; }
      .card[data-card-id="intro"] .name { font-family: "Instrument Sans"; font-weight: 700; font-size: 56px; line-height: 1; color: var(--ink); letter-spacing: -0.5px; white-space: nowrap; }
      .card[data-card-id="intro"] .role { font-family: "Instrument Sans"; font-weight: 600; font-size: 26px; line-height: 1; color: rgba(10,10,10,0.74); letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="graphic-overlays" data-start="0" data-duration="8" data-fps="60" data-width="1920" data-height="1080">
      <div class="video-wrapper" id="video-wrap">
        <video id="bg-video" src="input-video.mp4" muted playsinline data-start="0" data-duration="8" data-track-index="1"></video>
      </div>

      <div class="card-host clip" data-card-id="intro" data-start="0" data-duration="8" data-track-index="2"
           style="left:120px;top:800px;width:1100px;height:240px;visibility:hidden;opacity:0;">
        <div class="card" data-card-id="intro">
          <div class="l3">
            <div class="bar" id="intro-bar">
              <img class="mark" id="intro-mark" src="reactsquad-mark.png" alt="ReactSquad" />
              <div class="divider"></div>
              <div class="text">
                <div class="name" id="intro-name">Speaker Name</div>
                <div class="role" id="intro-role">Role &nbsp;·&nbsp; Company</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script src="vendor/gsap.min.js"></script>
      <script>
        (function () {
          const gsap = window.gsap;
          const tl = gsap.timeline({ paused: true });
          const HOST = '.card-host[data-card-id="intro"]';
          const S = '.card[data-card-id="intro"] ';

          tl.set(HOST, { visibility: "visible" }, 0.35);
          tl.set(HOST, { opacity: 1 }, 0.35);

          // bar wipes in from the left
          tl.fromTo(S + '#intro-bar', { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, 0.35);
          // mark settles, then name + role rise in
          tl.from(S + '#intro-mark', { opacity: 0, x: -10, duration: 0.40, ease: "power2.out" }, 0.55);
          tl.from(S + '#intro-name', { opacity: 0, y: 14, duration: 0.45, ease: "power3.out" }, 0.66);
          tl.from(S + '#intro-role', { opacity: 0, y: 12, duration: 0.42, ease: "power3.out" }, 0.82);

          // exit: gentle fade + drop
          tl.to(HOST, { opacity: 0, y: 24, duration: 0.5, ease: "power2.in" }, 4.70);
          tl.set(HOST, { visibility: "hidden" }, 5.25);

          window.__timelines = window.__timelines || {};
          window.__timelines["graphic-overlays"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
